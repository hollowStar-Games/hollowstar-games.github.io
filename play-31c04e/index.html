<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d1a">
<link rel="apple-touch-icon" href="../icon.png"><link rel="icon" href="../icon.png">
</head><body>
<title>Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: one-screen mobile app. Screens (home, levels, game, shop, profile, settings) share a living night
   backdrop; sheets slide up from the bottom. Board theme tokens are swapped at runtime by the equipped theme. */
:root {
  --void: #07080f;
  --night: #0e1020;
  --tile: #1b1f36;
  --tile-hi: #252a47;
  --hair: rgba(236, 235, 245, 0.08);
  --ink: #eeedf7;
  --muted: #8f90ad;
  --you: #ffc46b;
  --echo: #8fe3e8;
  --shard: #b9a3ff;
  --good: #8ff0bf;
  --bad: #ff8fa6;
  --tint: #ffc46b;
  --font-mark: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-ui: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--font-ui); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#backdrop { position: fixed; inset: 0; z-index: 0; background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--tint) 10%, transparent), transparent 60%), radial-gradient(90% 60% at 50% 115%, color-mix(in srgb, var(--echo) 7%, transparent), transparent 60%), var(--void); transition: background 1.2s; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.screen { position: relative; z-index: 1; height: 100%; max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 14px; display: flex; flex-direction: column; gap: 12px; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--you); outline-offset: 3px; border-radius: 14px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ghost { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--muted); background: color-mix(in srgb, var(--tile) 60%, transparent); border: 1px solid var(--hair); position: relative; flex: none; }
.ghost:hover { color: var(--ink); }
.badge { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--you); color: #2a1a00; font-size: 11px; font-weight: 800; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.label { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar .title { text-align: center; flex: 1; min-width: 0; }
.bar .title strong { display: block; font-size: 19px; font-weight: 600; font-family: var(--font-mark); letter-spacing: .04em; }
.spacer { width: 44px; flex: none; }
.wallet { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px 0 10px; border-radius: 999px; background: color-mix(in srgb, var(--tile) 70%, transparent); border: 1px solid var(--hair); font-weight: 800; font-variant-numeric: tabular-nums; }
.shard-ic { width: 16px; height: 16px; flex: none; }
.scroller { flex: 1; overflow-y: auto; margin-inline: -16px; padding: 4px 16px 28px; scrollbar-width: none; display: flex; flex-direction: column; gap: 22px; }
.scroller::-webkit-scrollbar { display: none; }
.panel { background: color-mix(in srgb, var(--tile) 55%, transparent); border: 1px solid var(--hair); border-radius: 18px; }

/* ---------- Home ---------- */
#home { justify-content: space-between; }
.home-top { display: flex; justify-content: space-between; align-items: center; }
.markwrap { position: relative; text-align: center; }
.mark { position: relative; font-family: var(--font-mark); font-weight: 700; font-size: clamp(50px, 17vw, 76px); letter-spacing: 0.2em; margin: 0; padding-left: 0.2em; line-height: 1; background: linear-gradient(180deg, #fff6e4, var(--you) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 24px color-mix(in srgb, var(--you) 35%, transparent)); }
.mark-echo { position: absolute; inset: 0; font-family: var(--font-mark); font-size: clamp(50px, 17vw, 76px); letter-spacing: 0.2em; padding-left: 0.2em; line-height: 1; color: var(--echo); opacity: 0.14; font-weight: 700; pointer-events: none; transform: translate(0.16em, 0.06em); filter: blur(1.5px); }
.tagline { margin: 18px auto 0; font-weight: 300; font-size: 16px; letter-spacing: .01em; max-width: 28ch; color: var(--muted); line-height: 1.55; text-align: center; text-wrap: balance; }
.home-actions { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
.pill { padding: 16px 28px; border-radius: 999px; font-weight: 800; font-size: 16px; background: linear-gradient(180deg, #ffd893, var(--you)); color: #2a1a00; box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--you) 60%, transparent), inset 0 1px 0 rgba(255,255,255,.5); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pill small { font-weight: 700; font-size: 11px; opacity: .65; letter-spacing: .12em; text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile-btn { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 4px 12px; border-radius: 18px; background: color-mix(in srgb, var(--tile) 60%, transparent); border: 1px solid var(--hair); font-size: 12px; font-weight: 700; color: var(--ink); position: relative; }
.tile-btn svg.i { color: var(--you); }
.tile-btn .sub { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.tile-btn .dot { position: absolute; top: 9px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 8px var(--bad); }
.testtag { font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: #ff8fa6; border: 1px solid color-mix(in srgb, #ff8fa6 45%, transparent); padding: 5px 9px; border-radius: 8px; }
.home-stats { font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.season-line { display: flex; align-items: center; gap: 10px; padding: 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.season-line b { color: var(--tint); font-family: var(--font-mark); letter-spacing: .16em; }
.season-line .prog { flex: 1; height: 4px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.season-line .prog i { display: block; height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--tint) 60%, transparent), var(--tint)); border-radius: 2px; }
.season-line span:last-child { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.flame { color: #ffb15c; }
.home-stats b { color: var(--you); }

/* ---------- Levels ---------- */
.chapter header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.chapter h3 { margin: 0; font-family: var(--font-mark); font-size: 17px; letter-spacing: 0.18em; font-weight: 700; }
.chapter h3 span { color: var(--chap); margin-right: 10px; }
.chapter .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.lv { aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: radial-gradient(circle at 50% 30%, var(--tile-hi), var(--tile)); border: 1px solid var(--hair); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.lv .st { display: flex; gap: 3px; min-height: 4px; font-size: 9px; color: var(--muted); line-height: 4px; }
.lv .st i { width: 4px; height: 4px; border-radius: 50%; background: var(--hair); }
.lv .st i.on { background: var(--you); box-shadow: 0 0 6px var(--you); }
.lv.done { border-color: color-mix(in srgb, var(--chap) 35%, transparent); }
.lv.next { box-shadow: 0 0 0 2px var(--chap), 0 0 18px -2px var(--chap); }
.lv:disabled { opacity: .28; cursor: default; }
.chapter { position: relative; padding: 16px 14px 18px; border-radius: 22px; background: linear-gradient(180deg, color-mix(in srgb, var(--chap) 9%, transparent), transparent 70%); border: 1px solid color-mix(in srgb, var(--chap) 16%, transparent); }
.chapter .mech { display: inline-flex; align-items: center; gap: 6px; margin: -4px 0 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--chap); text-transform: uppercase; }
.chapter .mech i { width: 6px; height: 6px; border-radius: 50%; background: var(--chap); box-shadow: 0 0 8px var(--chap); }
.chapter.locked .lgrid { filter: saturate(.3); }
.chapter .lockmsg { font-size: 12.5px; color: var(--muted); margin: -2px 0 12px; display: flex; gap: 6px; align-items: center; }
.chapter .lockmsg svg { width: 15px; height: 15px; }
.chapter.prologue .lgrid { grid-template-columns: repeat(4, 1fr); }

/* ---------- Game ---------- */
#stage { position: relative; flex: 1 1 auto; min-height: 0; touch-action: none; }
#game { touch-action: none; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#toast { position: absolute; left: 50%; top: 6px; transform: translate(-50%, -6px); background: color-mix(in srgb, var(--night) 92%, transparent); border: 1px solid var(--hair); padding: 9px 16px; border-radius: 999px; font-size: 13px; max-width: calc(100% - 16px); text-align: center; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; backdrop-filter: blur(8px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 22px; flex-wrap: wrap; }
.status b { color: var(--ink); }
#chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--echo); font-weight: 700; }
.chip svg { width: 16px; height: 16px; transform: rotate(-90deg); }
#hint { margin: 0; padding: 12px 14px; font-size: 14px; line-height: 1.5; text-wrap: pretty; }
#hint::before { content: attr(data-label); display: block; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--echo); margin-bottom: 4px; font-weight: 800; }
.controls { display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; align-items: center; gap: 6px; padding-bottom: 4px; }
.controls.lefty { direction: rtl; }
.controls.lefty > * { direction: ltr; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 6px 0; border-radius: 14px; }
.ctl .disc { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--tile) 75%, transparent); border: 1px solid var(--hair); color: var(--ink); transition: transform .12s; }
.ctl:active .disc { transform: scale(.94); }
#btnEcho { gap: 8px; }
#btnEcho .orb { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; color: #062a2d; background: radial-gradient(circle at 50% 35%, #d9fbfc, var(--echo) 55%, #4fb4bb); box-shadow: 0 0 0 6px color-mix(in srgb, var(--echo) 12%, transparent), 0 10px 34px -6px color-mix(in srgb, var(--echo) 70%, transparent); transition: transform .12s, filter .3s; }
#btnEcho .orb svg { width: 34px; height: 34px; stroke-width: 1.8; }
#btnEcho.cue .orb { animation: cue 1s ease-in-out infinite; }
.ctl.cue .disc { animation: cue2 1s ease-in-out infinite; color: var(--you); border-color: var(--you); }
@keyframes cue2 { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--you) 28%, transparent); } }
#hint.is-hint { border-color: color-mix(in srgb, var(--you) 45%, transparent); }
@keyframes cue { 50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--you) 30%, transparent), 0 10px 34px -6px var(--echo); } }
#btnEcho:active .orb { transform: scale(.95); }
#btnEcho:disabled { cursor: default; }
#btnEcho:disabled .orb { filter: grayscale(1) brightness(.45); box-shadow: none; }
#echoDots { display: flex; gap: 5px; min-height: 6px; }
#echoDots i { width: 6px; height: 6px; border-radius: 50%; background: var(--echo); box-shadow: 0 0 6px var(--echo); }
#echoDots i.used { background: var(--hair); box-shadow: none; }

/* ---------- Sheets ---------- */
.veil { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: color-mix(in srgb, var(--void) 60%, transparent); }
.veil.center { align-items: center; padding: 16px; }
.sheet { width: 100%; max-width: 520px; max-height: 92%; overflow-y: auto; padding: 24px 20px calc(22px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(180deg, color-mix(in srgb, var(--tile) 97%, transparent), var(--night)); border: 1px solid var(--hair); border-bottom: 0; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; gap: 14px; animation: rise .4s cubic-bezier(.2,.9,.2,1); }
.veil.center .sheet { border-radius: 24px; border-bottom: 1px solid var(--hair); max-width: 400px; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--font-mark); font-size: 21px; letter-spacing: .14em; font-weight: 700; text-align: center; }
.sheet p { margin: 0; color: var(--muted); line-height: 1.5; text-align: center; text-wrap: pretty; }
.sheet .row { display: flex; gap: 10px; }
.sheet .row > button { flex: 1; }
.btn { padding: 15px; border-radius: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.alt { background: color-mix(in srgb, var(--tile-hi) 70%, transparent); border: 1px solid var(--hair); }
.btn.go { background: linear-gradient(180deg, #ffd893, var(--you)); color: #2a1a00; }
.btn.echo { background: linear-gradient(180deg, #c9f7f9, var(--echo)); color: #062a2d; }
.btn.danger { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }
.btn:disabled { opacity: .4; cursor: default; }
.bigstars { display: flex; justify-content: center; gap: 14px; }
.bigstars svg { width: 44px; height: 44px; }
.bigstars svg path { fill: var(--hair); }
.bigstars svg.on path { fill: var(--you); filter: drop-shadow(0 0 10px var(--you)); }
.bigstars svg.on { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.bigstars svg.on:nth-child(2) { animation-delay: .12s; } .bigstars svg.on:nth-child(3) { animation-delay: .24s; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } }
.reward { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.reward span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: color-mix(in srgb, var(--shard) 14%, transparent); color: var(--shard); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px; text-align: left; width: 100%; }
.opt .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--you) 14%, transparent); color: var(--you); flex: none; }
.opt .ic.e { background: color-mix(in srgb, var(--echo) 14%, transparent); color: var(--echo); }
.opt .ic.s { background: color-mix(in srgb, var(--shard) 14%, transparent); color: var(--shard); }
.opt .tx { flex: 1; min-width: 0; }
.opt .tx strong { display: block; font-size: 15px; }
.opt .tx small { color: var(--muted); font-size: 12.5px; line-height: 1.4; display: block; }
.opt .cost { font-weight: 800; font-size: 13px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.opt:disabled { opacity: .4; cursor: default; }
.demo-note { font-size: 12px; color: var(--muted); text-align: center; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--hair); line-height: 1.45; }

/* ---------- Shop ---------- */
.tabs { display: flex; gap: 4px; padding: 4px; overflow-x: auto; scrollbar-width: none; border-radius: 14px; background: color-mix(in srgb, var(--tile) 60%, transparent); border: 1px solid var(--hair); }
.tabs button { flex: 1 0 auto; padding: 9px 9px; border-radius: 10px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--tile-hi); color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.card { padding: 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; position: relative; }
.card.equipped { border-color: color-mix(in srgb, var(--you) 50%, transparent); }
.card .name { font-weight: 800; font-size: 14px; }
.card .how { font-size: 11.5px; color: var(--muted); min-height: 1.4em; line-height: 1.35; }
.card .tag { position: absolute; top: 10px; left: 10px; font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: color-mix(in srgb, var(--you) 18%, transparent); color: var(--you); }
.card .tag.e { background: color-mix(in srgb, var(--echo) 16%, transparent); color: var(--echo); }
.card .buy { width: 100%; padding: 10px; border-radius: 12px; font-weight: 800; font-size: 13px; display: inline-flex; justify-content: center; align-items: center; gap: 6px; background: color-mix(in srgb, var(--tile-hi) 80%, transparent); border: 1px solid var(--hair); }
.card .buy.own { background: transparent; color: var(--muted); }
.card .buy.eq { color: var(--you); background: transparent; border-color: color-mix(in srgb, var(--you) 40%, transparent); }
.card .buy:disabled { opacity: .45; cursor: default; }
.preview { width: 96px; height: 96px; display: block; }
.letter-btn { font-size: 12px; color: var(--you); font-weight: 700; padding: 4px 10px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--you) 40%, transparent); }
.letters { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.letters button { aspect-ratio: 1; border-radius: 10px; background: var(--tile); border: 1px solid var(--hair); font-family: var(--font-mark); font-weight: 700; font-size: 17px; }
.letters button[aria-pressed="true"] { background: var(--you); color: #2a1a00; }
.porb { width: 46px; height: 46px; border-radius: 50%; }
.porb.nova { animation: hue 6s linear infinite; }
@keyframes hue { to { filter: hue-rotate(360deg); } }
.pboard { display: grid; grid-template-columns: repeat(3, 22px); gap: 4px; padding: 8px; border-radius: 14px; }
.pboard i { width: 22px; height: 22px; border-radius: 6px; }
.packs { display: flex; flex-direction: column; gap: 10px; }
.pack { padding: 4px; }
.pack.star { border-color: color-mix(in srgb, var(--you) 45%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--you) 12%, transparent), color-mix(in srgb, var(--tile) 55%, transparent)); }
.price { padding: 8px 12px; border-radius: 10px; background: var(--tile-hi); color: var(--ink); font-weight: 800; font-size: 13px; white-space: nowrap; }

/* ---------- Profile ---------- */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 14px 10px; text-align: center; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); font-weight: 600; }
.achs { display: flex; flex-direction: column; gap: 8px; }
.ach { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.ach .medal { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--tile); color: var(--muted); border: 1px solid var(--hair); }
.ach.got .medal { background: radial-gradient(circle at 40% 35%, #fff2d6, var(--you) 60%, #c27a1a); color: #2a1a00; border: 0; box-shadow: 0 0 14px -2px var(--you); }
.ach .tx { flex: 1; min-width: 0; }
.ach .tx strong { display: block; font-size: 14px; }
.ach .tx small { color: var(--muted); font-size: 12px; }
.ach .prog { height: 4px; border-radius: 2px; background: var(--hair); margin-top: 6px; overflow: hidden; }
.ach .prog i { display: block; height: 100%; background: var(--you); }
.ach .rw { font-size: 12px; font-weight: 800; color: var(--shard); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.ach.got .rw { color: var(--muted); }
h4.sec { margin: 0 0 10px; }

/* ---------- Settings ---------- */
.group { display: flex; flex-direction: column; }
.set { display: flex; align-items: center; gap: 12px; padding: 13px 16px; min-height: 56px; }
.set + .set { border-top: 1px solid var(--hair); }
.set .tx { flex: 1; min-width: 0; }
.set .tx strong { display: block; font-size: 14.5px; font-weight: 700; }
.set .tx small { color: var(--muted); font-size: 12px; line-height: 1.4; display: block; }
.switch { width: 48px; height: 28px; border-radius: 14px; background: var(--tile); border: 1px solid var(--hair); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: color-mix(in srgb, var(--you) 35%, var(--tile)); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--you); }

<script>
// ---- Echo engine (pure logic, no DOM) ----
// Map legend
//   #  wall          .  floor        S  start        E  exit
//   a b c  plates    A B C  doors (open while ANY plate of that colour is held)
//   P Q R  linked doors for a b c (open only while EVERY plate of that colour is held)
//   1 2    tide gates (1 is open on ticks 0,1 of every 4; 2 on ticks 2,3)
//   %      crumbling floor (breaks once someone steps off it)
//   ~      silent floor (an echo that walks onto it fades away; you can cross it)
// Echoes are recordings: they replay their steps exactly and are never blocked. Only the live player is.

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], wait: [0, 0] };
const LINK_OF = { P: "a", Q: "b", R: "c" };
const TIDE_PERIOD = 4;
const isDoorCh = c => /[A-CP-R]/.test(c);
const isGateCh = c => c === "1" || c === "2";
const gateOpenAt = (c, t) => c === "1" ? (t % TIDE_PERIOD) < 2 : (t % TIDE_PERIOD) >= 2;
const keyOf = p => p[0] + "," + p[1];

function parseLevel(def) {
  const grid = def.map.map(r => r.split(""));
  let start, exit;
  const plates = {}, doors = {}, links = {}, gates = [], crumbles = [], silences = [];
  grid.forEach((row, y) => row.forEach((ch, x) => {
    if (ch === "S") { start = [x, y]; row[x] = "."; }
    else if (ch === "E") exit = [x, y];
    else if (/[a-c]/.test(ch)) (plates[ch] = plates[ch] || []).push([x, y]);
    else if (/[A-C]/.test(ch)) (doors[ch.toLowerCase()] = doors[ch.toLowerCase()] || []).push([x, y]);
    else if (/[P-R]/.test(ch)) (links[ch] = links[ch] || []).push([x, y]);
    else if (isGateCh(ch)) gates.push([x, y]);
    else if (ch === "%") crumbles.push([x, y]);
    else if (ch === "~") silences.push([x, y]);
  }));
  return { def, maxEchoes: def.echoes, grid, w: grid[0].length, h: grid.length, start, exit, plates, doors, links, gates, crumbles, silences, vanish: new WeakMap() };
}

function newState(lvl) {
  return { echoes: [], path: [lvl.start.slice()], won: false };
}

const at = (p, t) => p[Math.min(t, p.length - 1)];
const same = (a, b) => a[0] === b[0] && a[1] === b[1];

function cell(lvl, x, y) {
  if (y < 0 || y >= lvl.h || x < 0 || x >= lvl.w) return "#";
  return lvl.grid[y][x];
}

// tick at which an echo fades on silent floor (Infinity if never)
function vanishAt(lvl, path) {
  if (!lvl.silences.length) return Infinity;
  let v = lvl.vanish.get(path);
  if (v === undefined) {
    v = Infinity;
    for (let i = 1; i < path.length; i++) if (lvl.grid[path[i][1]][path[i][0]] === "~") { v = i; break; }
    lvl.vanish.set(path, v);
  }
  return v;
}
// where an echo is at tick t, or null once it has faded
function echoAt(lvl, e, t) { return t >= vanishAt(lvl, e) ? null : at(e, t); }
function positionsAt(lvl, echoes, t) { const out = []; for (const e of echoes) { const p = echoAt(lvl, e, t); if (p) out.push(p); } return out; }

function openDoors(lvl, positions) {
  const held = pl => positions.some(p => same(p, pl));
  const open = {};
  for (const k in lvl.doors) open[k] = (lvl.plates[k] || []).some(held);
  for (const k in lvl.links) { const ps = lvl.plates[LINK_OF[k]] || []; open[k] = ps.length > 0 && ps.every(held); }
  return open;
}
const doorIsOpen = (open, ch) => /[A-C]/.test(ch) ? !!open[ch.toLowerCase()] : !!open[ch];
// how many plates of a linked door are held (for drawing "1 of 2")
function linkHeld(lvl, positions, ch) { return (lvl.plates[LINK_OF[ch]] || []).filter(pl => positions.some(p => same(p, pl))).length; }

// crumbling floor broken by tick T: someone stood on it and stepped off at or before T.
// `own` is the live player's path so far (index = tick).
const EMPTY = new Set();
function brokenAt(lvl, echoes, own, T) {
  if (!lvl.crumbles.length) return EMPTY;
  const out = new Set();
  const crumb = p => lvl.grid[p[1]][p[0]] === "%";
  for (const e of echoes) {
    const lim = Math.min(T, e.length - 1);
    for (let tau = 0; tau < lim; tau++) {
      const p = echoAt(lvl, e, tau); if (!p) break;
      const q = echoAt(lvl, e, tau + 1);
      if (crumb(p) && (!q || !same(p, q))) out.add(keyOf(p));
    }
  }
  if (own) for (let tau = 0; tau + 1 < own.length && tau + 1 <= T; tau++) {
    const p = own[tau];
    if (crumb(p) && !same(p, own[tau + 1])) out.add(keyOf(p));
  }
  return out;
}

// Pure move check: where would the player at `pos` end up after `dir`, going from tick t to t+1?
// `own` = the player's path up to tick t (needed for crumbling floor).
function tryStep(lvl, echoes, t, pos, dir, own) {
  const [dx, dy] = DIRS[dir];
  const np = [pos[0] + dx, pos[1] + dy];
  const c = cell(lvl, np[0], np[1]);
  if (c === "#") return { ok: false, reason: "wall" };
  const waiting = dir === "wait";
  if (isDoorCh(c)) {
    const positions = positionsAt(lvl, echoes, t + 1); positions.push(np);
    if (!doorIsOpen(openDoors(lvl, positions), c)) return { ok: false, reason: waiting ? "closing" : (/[P-R]/.test(c) ? "linked" : "locked") };
  }
  if (isGateCh(c) && !gateOpenAt(c, t + 1)) return { ok: false, reason: waiting ? "tideclose" : "tide" };
  if (c === "%" && !waiting && brokenAt(lvl, echoes, own, t + 1).has(keyOf(np))) return { ok: false, reason: "broken" };
  return { ok: true, np };
}

// Returns { ok, reason } and mutates state on success.
function step(lvl, state, dir) {
  if (state.won) return { ok: false, reason: "won" };
  const t = state.path.length - 1;
  const r = tryStep(lvl, state.echoes, t, state.path[t], dir, state.path);
  if (!r.ok) return r;
  state.path.push(r.np);
  if (same(r.np, lvl.exit)) state.won = true;
  return { ok: true };
}

function echo(lvl, state) {
  if (state.echoes.length >= lvl.maxEchoes) return { ok: false, reason: "noechoes" };
  if (state.path.length < 2) return { ok: false, reason: "empty" };
  state.echoes.push(state.path);
  state.path = [lvl.start.slice()];
  return { ok: true };
}

function totalMoves(state) {
  return state.echoes.reduce((s, e) => s + e.length - 1, 0) + state.path.length - 1;
}
